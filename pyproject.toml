[project]
name = "kuriscribe"
version = "1.0.0"
description = "Plataforma web y de escritorio para la transcripción inteligente de vídeos de YouTube a texto con subtítulos nativos y Whisper Turbo."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0.0,<3.2.0",
    "flask-cors>=4.0.0,<5.1.0",
    "flask-limiter>=3.5.0,<3.10.0",
    "youtube-transcript-api>=1.0.0,<2.0.0",
    "yt-dlp>=2024.0.0,<2027.0.0",
    "groq>=0.9.0,<1.0.0",
    "deep-translator>=1.11.4,<2.0.0",
    "requests>=2.31.0",
    "curl-cffi>=0.7.0",
    "faster-whisper>=1.2.1",
]

[tool.hatch.build.targets.wheel]
only-include = ["server.py", "services", "desktop.py"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
