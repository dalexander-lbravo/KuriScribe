[package]
name = "kuriscribe-desktop"
version = "1.0.0"
description = "KuriScribe Desktop - Transcripción Gratuita de YouTube"
authors = ["Alexander Luyo", "Belén Tesore"]
edition = "2021"

[lib]
name = "kuriscribe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-opener = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
